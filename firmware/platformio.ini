; PlatformIO Project Configuration File for BMO Personal Desktop Companion
; Target Microcontroller: ESP32-CAM (AI-Thinker) / ESP32 Generic

[platformio]
default_envs = esp32cam
src_dir = src
include_dir = include

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.2
    bblanchon/ArduinoJson @ ^7.3.0
    knolleary/PubSubClient @ ^2.8
    Wire
    SPI

; Standard Environment: AI-Thinker ESP32-CAM
[env:esp32cam]
board = esp32cam
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
build_flags = 
    ${env.build_flags}
    -D BOARD_ESP32_CAM=1

; First hardware test: OLED and buttons, no Wi-Fi/MQTT credentials needed
[env:esp32cam_bench]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -D BMO_BENCH_OFFLINE=1

; Alternative Environment: Standard ESP32 Dev Module
[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_flags = 
    ${env.build_flags}
    -D BOARD_ESP32_DEV=1
